name: release

# Builds a release candidate from an exact commit into a DRAFT GitHub release: the three-platform tests are the
# evidence, each platform's archive holds one self-contained tally executable, and SHA256SUMS names every asset.
# Vericairn's github-releases provider dispatches it; publishing the draft is the operator's act after acceptance
# in the example estate.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal Version in Directory.Build.props)
        required: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: The version matches the project
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: grep -q "<Version>$VERSION</Version>" Directory.Build.props || { echo "Directory.Build.props does not declare version $VERSION"; exit 1; }
      - run: dotnet test Tally.slnx --configuration Release

  package:
    needs: [verify]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish one self-contained executable
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          dotnet publish src/Tally/Tally.csproj --configuration Release --runtime "$RID" --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none --output "out/$RID"
          mkdir -p dist
          cp LICENSE "out/$RID/"
          case "$RID" in
            win-*) (cd "out/$RID" && 7z a -tzip "../../dist/tally-$VERSION-$RID.zip" tally.exe LICENSE > /dev/null) ;;
            *) tar -czf "dist/tally-$VERSION-$RID.tar.gz" -C "out/$RID" tally LICENSE ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  draft:
    # The only job that writes: it holds the token for creating the draft and checks nothing out.
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tally-*
          path: dist
          merge-multiple: true
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        # A draft of the same version left by an earlier failed run is replaced; a published release is never touched.
        run: |
          set -eu
          cd dist
          sha256sum tally-* > SHA256SUMS
          earlier=$(gh release view "v$VERSION" --json isDraft -q 'select(.isDraft) | "draft"' 2>/dev/null || true)
          if [ "$earlier" = "draft" ]; then gh release delete "v$VERSION" --yes; fi
          gh release create "v$VERSION" --draft --title "tally $VERSION" --target "$COMMIT" \
            --notes "An unsigned developer build of the example app, managed by the public example estate." \
            "tally-$VERSION-linux-x64.tar.gz" "tally-$VERSION-osx-arm64.tar.gz" "tally-$VERSION-win-x64.zip" SHA256SUMS
